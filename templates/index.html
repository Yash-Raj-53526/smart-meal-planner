<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Meal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 14h20a10 10 0 0 1-20 0z"/><path d="M10 9c-1.2-2 1.2-3 0-5.5M17 9c-1.2-2 1.2-3 0-5.5"/></svg>
        <span>Meal Planner</span>
      </div>
      <a href="#cook" data-view="cook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="13" r="6.5"/><path d="M16.5 13H22"/></svg>Cook now</a>
      <a href="#plan" data-view="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week plan</a>
      <a href="#recipes" data-view="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Recipes</a>
      <a href="#pantry" data-view="pantry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h6M9.5 3.5V6M14.5 3.5V6"/><rect x="6" y="6" width="12" height="14.5" rx="3"/><path d="M6 12h12"/></svg>Pantry</a>
      <a href="#reports" data-view="reports">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>Reports</a>
      <p class="rail-note">Changes are saved straight to your CSV files.</p>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
